<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Exercício 2 - seguro</title>
    <script>
      async function carregarPerfil() {
        const res = await fetch("/exercicio2", {
          credentials: "include" // envia cookies HttpOnly
        });
        const perfis = await res.json();

        const container = document.getElementById("containerPerfis");
        container.innerHTML = ""; // limpa os perfis anteriores

        for (const perfil of perfis) {
          const div = document.createElement("div");

          // Cria parágrafo do nome de forma segura
          const nome = document.createElement("p");
          const strongNome = document.createElement("strong");
          strongNome.textContent = "Nome:";
          nome.appendChild(strongNome);
          nome.appendChild(document.createTextNode(" " + perfil.name));

          // Cria parágrafo da descrição de forma segura
          const descricao = document.createElement("p");
          const strongDesc = document.createElement("strong");
          strongDesc.textContent = "Descrição:";
          descricao.appendChild(strongDesc);
          descricao.appendChild(document.createTextNode(" " + perfil.description));

          div.appendChild(nome);
          div.appendChild(descricao);
          div.appendChild(document.createElement("hr"));

          container.appendChild(div);
        }
      }

      async function salvarPerfil() {
        const name = document.getElementById("inputNome").value;
        const description = document.getElementById("inputDescricao").value;

        await fetch("/exercicio2", {
          method: "POST",
          credentials: "include", // envia cookies HttpOnly
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, description })
        });

        carregarPerfil();
      }

      window.onload = carregarPerfil;
    </script>
  </head>
  <body>
    <h3>Atualizar Perfil</h3>
    <label>Nome: <input type="text" id="inputNome" /></label><br />
    <label>Descrição: <textarea id="inputDescricao"></textarea></label><br />
    <button onclick="salvarPerfil()">Salvar</button>

    <h3>Visualização dos Perfis</h3>
    <div id="containerPerfis"></div>
  </body>
</html>
