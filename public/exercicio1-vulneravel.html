<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Exercício 1 - seguro</title>
    <script>
      // Simula um cookie de autenticação
      document.cookie = "token=exer01cliente; path=/";

      // Abordagem segura: exibe o conteúdo do parâmetro q sem interpretar como HTML
      window.onload = function () {
        const params = new URLSearchParams(window.location.search);
        const q = params.get("q") || "";

        const resultadoEl = document.getElementById("resultado");
        // Usa textContent para evitar XSS
        resultadoEl.textContent = q;
      };
    </script>
  </head>
  <body>
    <h3>Resultados da busca:</h3>
    <div id="resultado"></div>
  </body>
</html>
